version: '3.8'

services:
  bot:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - RPC_URL=${RPC_URL:-https://arb1.arbitrum.io/rpc}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
    volumes:
      - ./config.json:/app/config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3